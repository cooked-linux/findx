[package]
name = "spotlight"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
shared = { path = "../shared" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
gtk4-layer-shell = "0.4"
zbus = { version = "5.5", features = ["tokio"] }
glib = "0.20"
gdk4 = "0.9"
tokio-util = "0.7.20"
async-trait = "0.1.92"
urlencoding = "2.1"
rusqlite = { version = "0.33", features = ["bundled"] }
syntect = "5.2"
image = "0.25"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3.17"

