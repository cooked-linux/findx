[package]
name = "finder"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
shared = { path = "../shared" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
async-trait = "0.1"
syntect = "5.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
zbus = { version = "5.5", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
async-channel = "2.5"
nix = { version = "0.29", features = ["fs", "user", "process", "resource", "signal"] }
libc = "0.2"
walkdir = "2.5"
filetime = "0.2"
xattr = "1.4"
uuid = { version = "1.28", features = ["v4", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
lru = "0.13"
parking_lot = "0.12"
dashmap = "6.2"
xdg = "2.5"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3.17"
