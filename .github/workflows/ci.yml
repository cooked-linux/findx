name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4, libadwaita, layer-shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwayland-dev \
            wayland-protocols \
            meson \
            ninja-build
          if sudo apt-get install -y libgtk4-layer-shell-dev 2>/dev/null; then
            echo "Installed libgtk4-layer-shell-dev via apt"
          else
            echo "libgtk4-layer-shell-dev not in apt; building from source"
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
              --prefix=/usr \
              -Dintrospection=false \
              -Dvapi=false \
              -Dexamples=false \
              -Ddocs=false \
              -Dtests=false \
              -Dsmoke-tests=false
            ninja -C /tmp/gtk4-layer-shell/build
            sudo ninja -C /tmp/gtk4-layer-shell/build install
            sudo ldconfig
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Clippy (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (cargo build)
        run: cargo build --workspace --all-targets

      - name: Tests (cargo test)
        run: cargo test --workspace --all-targets
