[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# Async runtime & parallelism
tokio = { version = "1.43", features = ["sync", "fs", "io-util", "process", "rt-multi-thread", "time"] }
rayon = "1.10"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & Logging
thiserror = "2.0"
tracing = "0.1"

# Filesystem & POSIX standards
xdg = "2.5"
mime_guess = "2.0"
xattr = "1.4"
nix = { version = "0.29", features = ["fs", "sched", "process", "zerocopy"] }
libc = "0.2"
trash = "5.2"

# Database & Indexing
rusqlite = { version = "0.33", features = ["bundled", "vtab", "backup"] }
fuzzy-matcher = "0.3"

# IPC & D-Bus
zbus = { version = "5.5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.17"
